name: test-kernel

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'src/**'
      - 'programs/**'
      - 'targets/**'
      - '.github/workflows/test-kernel.yml'

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-x86-64-linux-gnu \
            binutils-x86-64-linux-gnu \
            nasm \
            grub-pc-bin \
            xorriso \
            mtools \
            python3-pyelftools \
            qemu-system-x86

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspace: .

      - name: Test kernel
        run: |
              set +e
              make test
              EXIT_CODE=$?
              set -e

              if [ "$EXIT_CODE" -eq 2 ]; then
                echo "Kernel tests passed"
                exit 0
              else
                echo "Kernel tests failed with exit code $EXIT_CODE"
                exit $EXIT_CODE
              fi