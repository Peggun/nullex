name: build-userspace

on:
  workflow_dispatch:
  push:
    paths:
      - 'Makefile'
      - 'programs/**'
      - '.github/workflows/build-userspace.yml'
  pull_request:
    paths:
      - 'Makefile'
      - 'programs/**'
      - '.github/workflows/build-userspace.yml'

jobs:
  userspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-x86-64-linux-gnu \
            binutils-x86-64-linux-gnu \
            nasm

      - name: Build userspace library
        run: make libnullex

      - name: Build userspace programs
        run: make userspace

      - name: Upload userspace artifacts
        uses: actions/upload-artifact@v4
        with:
          name: userspace-build
          path: |
            build/userspace/**
          if-no-files-found: error
