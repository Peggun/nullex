[package]
name = "nullex"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
x86_64 = { version = "0.14.2", features = ["instructions"] }
hashbrown = { version = "0.15.2", features = ["inline-more"] }
futures = { version = "0.3", default-features = false }
thiserror = { version = "2.0.16", default-features = false }
crossbeam-queue = { version = "0.3.11", default-features = false, features = ["alloc"] }
smoltcp = { version = "0.13.0", default-features = false, features = ["proto-ipv4", "socket-tcp", "medium-ethernet", "alloc", "log"] }
log = "0.4.29"
embedded-tls = { version = "0.18.0", default-features = false, features = ["log", "alloc"] }
getrandom = "0.4.2"
rand_core = "0.6"
embedded-io = "0.7.1"
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft-compact"] }
regex = { version = "1.13.0", default-features = false, features = ["unicode"] }
bytemuck = { version = "1.25.1", default-features = false, features = ["derive"] }
raw-cpuid = "11.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
test = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }
