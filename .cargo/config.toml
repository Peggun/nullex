[unstable]
build-std-features = ["compiler-builtins-mem"]
build-std = ["core", "compiler_builtins", "alloc"]
bindeps = true
json-target-spec = true

[target.x86_64-unknown-none]
rustflags = [
    "-C", "force-frame-pointers=yes",
    "-C", "debuginfo=2",
    "-C", "opt-level=0",

    "-C", "link-arg=--whole-archive",
    "-C", "link-arg=-lnullex",
    "-C", "link-arg=--no-whole-archive",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "target-feature=-mmx,-sse,+soft-float",
    "--cfg", "getrandom_backend=\"custom\"",
    "--cfg", 'curve25519_dalek_backend="serial"',
    "--cfg", 'curve25519_dalek_bits="64"',
    "--cfg", "aes_force_soft",
    "--cfg", "aes_compact",
    "--cfg", "polyval_force_soft",
]

[env]
AS = "x86_64-elf-as"
CC_x86_64_unknown_none = "x86_64-elf-gcc"
AR_x86_64_unknown_none = "x86_64-elf-ar"
LD_x86_64_unknown_none = "x86_64-elf-ld"